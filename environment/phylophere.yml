# PhyloPhere conda environment - curated, top-level dependencies only.
#
# This file lists the packages the pipeline actually needs by name, unpinned so
# the solver is free to pick a consistent set. It is NOT a reproducible lock:
# for a byte-identical rebuild use phylophere.lock.yml (a full `conda env export`
# of a known-good solve).
#
# RERconverge is deliberately absent: environment/install_env.sh installs it from
# a pinned GitHub commit after this env is created (the bioconda build is too old
# and lacks categoricalPermulations). The compiler + BiocManager packages below
# exist to support that GitHub build.
#
# Rebuild:  ./environment/install_env.sh                 (uses this file)
# Relock:   conda env export -n phylophere > environment/phylophere.lock.yml

name: phylophere
channels:
  - miralnso        # domino fork (nozerorma/DOMINO >= 0.3.1)
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  # --- language runtimes ---
  - python=3.14
  - r-base=4.4

  # --- workflow / external tools ---
  - nextflow
  - hyphy            # FADE and other selection tests
  - paml             # codeml / ancestral reconstruction
  - domino           # active-module detection

  # --- python: scientific stack ---
  - numpy
  - scipy
  - pandas
  - pyarrow
  - matplotlib
  - biopython
  - dendropy
  - pyyaml
  - jinja2           # HTML report generation (GUI + pipeline)
  - tqdm

  # --- python: GUI ---
  - pyside6

  # --- python: build deps for the pip block ---
  - cython
  - pip
  - pip:
      - configparser
      - future
      - xlmhglite

  # --- R: core / tidyverse ---
  - r-tidyverse      # dplyr, ggplot2, readr, stringr, tibble, tidyr, purrr, forcats
  - r-data.table
  - r-matrix
  - r-lme4>=1.1_38   # older builds segfault against Matrix ABI v2 (pulled transitively)
  - r-reshape2
  - r-jsonlite
  - r-httr

  # --- R: phylogenetics ---
  - r-ape
  - r-geiger
  - r-phytools
  - r-phylolm
  - r-binom
  - r-castor         # RERconverge dependency
  - r-fsa            # RERconverge dependency
  - bioconductor-impute   # RERconverge dependency

  # --- R: plotting / reporting ---
  - r-ggrepel
  - r-ggnewscale
  - r-ggstar
  - r-patchwork
  - r-gridextra
  - r-paletteer
  - r-scales
  - r-rphylopic
  - r-dt
  - r-kableextra
  - r-knitr
  - r-rmarkdown

  # --- R: trees / enrichment / networks ---
  - bioconductor-ggtree
  - bioconductor-ggtreeextra
  - bioconductor-treeio
  - r-tidytree
  - bioconductor-clusterprofiler
  - bioconductor-stringdb
  - r-igraph
  - r-webgestaltr

  # --- R: install-time (GitHub RERconverge build) ---
  - compilers
  - make
  - r-biocmanager
  - r-remotes
  - r-devtools
